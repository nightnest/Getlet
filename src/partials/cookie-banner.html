<div class="cookie-banner" id="cookie-banner" role="dialog" aria-modal="false" aria-labelledby="cookie-title" hidden>
  <div class="cookie-inner">
    <h2 id="cookie-title">Cookies on this site</h2>
    <p>We use essential storage to remember your cookie choice. With your permission we would also use analytics cookies to understand how the site is used. Nothing is set until you choose. <a href="{{link:privacy}}">Read the privacy and cookie notice</a>.</p>
    <div class="cookie-manage" id="cookie-manage" hidden>
      <div class="check-row"><input type="checkbox" id="ck-essential" checked disabled><label for="ck-essential">Essential: remembers this choice (always on)</label></div>
      <div class="check-row"><input type="checkbox" id="ck-analytics"><label for="ck-analytics">Analytics: helps us improve the site (off unless you tick it)</label></div>
      <button type="button" class="btn btn-navy btn-sm" id="cookie-save">Save my choices</button>
    </div>
    <div class="cookie-actions">
      <button type="button" class="btn btn-navy" id="cookie-accept">Accept analytics</button>
      <button type="button" class="btn btn-navy" id="cookie-reject">Reject analytics</button>
      <button type="button" class="btn btn-outline" id="cookie-toggle" aria-expanded="false" aria-controls="cookie-manage">Manage choices</button>
    </div>
  </div>
</div>
